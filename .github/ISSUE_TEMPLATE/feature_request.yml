name: Feature request
description: Propose a new capability or improvement
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [api-py, web, mobile, contracts, packages, ci/infra, docs]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?

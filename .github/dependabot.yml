# Weekly dependency updates for every ecosystem in the repo. Related updates are grouped so a
# week produces a handful of PRs, not dozens. Patch updates are merged automatically by
# .github/workflows/dependabot-automerge.yml once CI passes.
version: 2

updates:
  # pnpm workspace (apps/web, apps/mobile, packages/*) and the root package.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # NestJS API being retired (not part of the pnpm workspace; has its own manifest).
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /apps/api-py
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/api-py
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

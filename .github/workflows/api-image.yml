name: API image

on:
  pull_request:
    paths:
      - "apps/api-py/**"
      - ".github/workflows/api-image.yml"
  push:
    branches: [develop, main]
    paths:
      - "apps/api-py/**"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/api-py

jobs:
  build:
    name: Build, smoke test, publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pin the three docker/* actions below to commit SHAs like the rest of this repository (dependabot can maintain them).
      - name: Build image (loaded locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: apps/api-py
          load: true
          tags: api-py:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container starts and answers /health)
        run: |
          set -euo pipefail
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: \
            -e NODE_ENV=development \
            api-py:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              echo "API is healthy"; docker logs api | tail -n 5; exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy"
          docker logs api
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (develop and main only)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: apps/api-py
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ github.ref_name == 'main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=gha

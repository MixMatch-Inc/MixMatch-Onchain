name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# The token is only used to enable auto-merge; nothing from the PR is checked out or executed.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Only Dependabot's own PRs, never forks.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'MixMatch-Inc/MixMatch-Onchain'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@ # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Merges only after the required checks pass (branch protection decides which are required).
        run: gh pr merge --auto --squash "$PR_URL"

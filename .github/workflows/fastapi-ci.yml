name: FastAPI Backend CI

on:
  # Called from ci.yml (the single required check). Also runnable by hand.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest Suite & Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install Dependencies
        working-directory: apps/api-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        working-directory: apps/api-py
        run: ruff check .

      - name: Ruff (format check)
        working-directory: apps/api-py
        run: ruff format --check .

      - name: Mypy (type check)
        working-directory: apps/api-py
        run: mypy src

      - name: Run Pytest with coverage
        working-directory: apps/api-py
        run: |
          PYTHONPATH=. pytest tests -v --durations=10 \
            --cov=src --cov-report=term-missing --cov-report=xml --cov-report=json:coverage.json \
            --cov-fail-under=60

      - name: Coverage summary
        if: always()
        working-directory: apps/api-py
        run: |
          if [ -f coverage.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          t = json.load(open("coverage.json"))["totals"]
          print("### Python coverage")
          print(f"- lines: {t['percent_covered']:.1f}% ({t['covered_lines']}/{t['num_statements']})")
          PY
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-coverage
          path: apps/api-py/coverage.xml
          if-no-files-found: ignore

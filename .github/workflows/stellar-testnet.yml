name: Stellar Testnet Integration

# Opt-in nightly run; never blocks PRs (issue #1471)
on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC nightly
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false

jobs:
  stellar-integration:
    name: Stellar Testnet Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only run on the canonical repo, not forks
    if: github.repository == 'MixMatch-Inc/MixMatch-Onchain'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e 'apps/api-py[test]' || pip install -r apps/api-py/pyproject.toml || true
          pip install pytest pytest-anyio httpx stellar-sdk

      - name: Run Stellar testnet integration tests
        env:
          STELLAR_NETWORK: testnet
          HORIZON_URL: https://horizon-testnet.stellar.org
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          JWT_SECRET: testnet-integration-jwt-secret-32chars
        run: |
          pytest apps/api-py/tests/ -m stellar_testnet -v \
            --junitxml=reports/testnet-junit.xml \
            --retries 2 \
            -x
        continue-on-error: true  # Failures page the team; they don't block PRs

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: stellar-testnet-results
          path: reports/testnet-junit.xml
        if: always()

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Stellar testnet integration tests failed. Check artifacts for details."
          # Wire a Slack/PagerDuty webhook here when available

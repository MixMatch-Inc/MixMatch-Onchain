[project]
name = "mixmatch-api"
version = "0.1.0"
description = "FastAPI backend for MixMatch social matching and payments platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "sse-starlette>=2.1.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "httpx>=0.27.0",
    "hvac>=2.3.0",
    "stellar-sdk>=9.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m \"not postgres\""
markers = ["postgres: Tier 2 suite that needs a PostgreSQL database (TEST_DATABASE_URL)"]
python_files = ["test_*.py"]

# Local development stack: Postgres, the FastAPI backend and the Next.js web app.
#
#   docker compose up --build                 # postgres + api + web
#   docker compose --profile vault up --build # additionally a dev-mode Vault for the KMS paths
#
# Every value below can be overridden from the shell or a root `.env` file (Compose reads it
# automatically). The defaults are for local development only; never reuse them elsewhere.
name: mixmatch

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mixmatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mixmatch_password}
      POSTGRES_DB: ${POSTGRES_DB:-mixmatch_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Dev-mode Vault (in-memory, auto-unsealed) for the transit KMS backend. Start with `--profile vault`
  # and set VAULT_ADDR=http://127.0.0.1:8200 and VAULT_TOKEN=<VAULT_DEV_ROOT_TOKEN> for the API.
  vault:
    profiles: [vault]
    image: hashicorp/vault:1.19.5
    command: ["server", "-dev"]
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api-py
    # Creates any missing tables (development only), then serves. Replace with real migrations once available.
    command:
      - sh
      - -c
      - python -m src.core.init_dev_db && exec uvicorn src.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips "$${FORWARDED_ALLOW_IPS:-*}"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mixmatch}:${POSTGRES_PASSWORD:-mixmatch_password}@postgres:5432/${POSTGRES_DB:-mixmatch_dev}
      JWT_SECRET: ${JWT_SECRET:-dev_insecure_jwt_secret_min_32_characters_long}
      WALLET_ENCRYPTION_KEY: ${WALLET_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      HORIZON_URL: ${HORIZON_URL:-https://horizon-testnet.stellar.org}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time, so it must be reachable from the browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:

# Nginx Traffic-Splitting Reverse Proxy Configuration
# Port #1167: Supports gradual canary cutover from NestJS to FastAPI

upstream nestjs_backend {
    server nestjs-api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream fastapi_backend {
    server fastapi-api:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Split clients based on user cookie or remote address (default: 10% canary to FastAPI)
split_clients "${remote_addr}${http_authorization}" $upstream_choice {
    10%     fastapi_backend;
    *       nestjs_backend;
}

server {
    listen 80;
    server_name api.mixmatch.app;

    # Allow explicit override via X-Api-Backend header (for QA / automated verification)
    set $target_backend $upstream_choice;
    if ($http_x_api_backend = "fastapi") {
        set $target_backend fastapi_backend;
    }
    if ($http_x_api_backend = "nestjs") {
        set $target_backend nestjs_backend;
    }

    location / {
        proxy_pass http://$target_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE and streaming timeout settings
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
